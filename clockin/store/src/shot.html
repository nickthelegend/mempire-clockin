<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mempire store screenshot</title>
<style>
  @font-face { font-family: "Lilita One"; src: url("../../../videos/gameplay-demo/brand/fonts/LilitaOne.ttf"); }
  @font-face { font-family: "Hanken Grotesk"; src: url("../../../videos/gameplay-demo/brand/fonts/HankenGrotesk.ttf"); font-weight: 100 900; }
  :root {
    --blue-deep: #0d2a5c; --blue: #14418f; --blue-lit: #2160c4; --pale: #59a6f5;
    --gold: #ffc422; --gold-hi: #ffe38a; --gold-dark: #a86e07;
    --purple: #9945ff; --teal: #14f195; --cyan: #22d3ee; --skr: #c8ff2e; --dim: #dbe8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 2400px; overflow: hidden; background: var(--blue-deep); }
  body {
    position: relative; color: #fff; font-family: "Hanken Grotesk", sans-serif;
    background:
      radial-gradient(900px 700px at 8% 2%, rgba(153, 69, 255, .55), transparent 70%),
      radial-gradient(900px 700px at 96% 10%, rgba(34, 211, 238, .42), transparent 70%),
      radial-gradient(1200px 1400px at 50% 70%, rgba(33, 96, 196, .55), transparent 70%),
      linear-gradient(180deg, #0f2d66 0%, #0b2552 55%, #071634 100%);
  }
  .quilt {
    position: absolute; inset: 0; background: url("art/quilt.jpg") center / 420px 420px repeat;
    opacity: .16; mix-blend-mode: soft-light;
  }
  .rays {
    position: absolute; inset: 0;
    background: repeating-conic-gradient(from 0deg at 50% 62%, rgba(255,255,255,.035) 0deg 7deg, transparent 7deg 16deg);
    -webkit-mask-image: radial-gradient(closest-side at 50% 62%, #000 30%, transparent 100%);
  }
  header { position: absolute; left: 0; right: 0; top: 96px; padding: 0 72px; text-align: center; }
  .chip {
    display: inline-block; font-weight: 800; font-size: 26px; letter-spacing: 3px; text-transform: uppercase;
    color: #08131f; padding: 10px 22px; border-radius: 999px; margin-bottom: 26px;
    background: linear-gradient(90deg, var(--purple), var(--teal));
    box-shadow: 0 6px 24px rgba(20, 241, 149, .25);
  }
  h1 {
    font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 104px; line-height: 1.0; letter-spacing: 1px;
    text-shadow: 0 6px 0 rgba(6, 16, 38, .55), 0 0 40px rgba(89, 166, 245, .35);
  }
  h1 em {
    font-style: normal; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #f59e0b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 6px 0 rgba(6, 16, 38, .55));
  }
  p.sub { margin-top: 26px; font-size: 40px; line-height: 1.3; font-weight: 600; color: var(--dim); }
  p.sub b { color: #fff; font-weight: 800; }
  .device {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 860px; border-radius: 76px; padding: 14px;
    background: linear-gradient(160deg, var(--gold-hi), var(--gold) 30%, var(--gold-dark) 70%, var(--gold) 100%);
    box-shadow: 0 50px 90px rgba(3, 8, 24, .65), 0 0 0 3px rgba(6, 16, 38, .8), 0 0 80px rgba(89, 166, 245, .25);
  }
  .screen {
    border-radius: 62px; overflow: hidden; background: #000; border: 6px solid #0a1530;
    aspect-ratio: 1206 / 2472;   /* the capture with the iOS status bar trimmed off */
  }
  .screen img { display: block; width: 100%; height: auto; margin-top: calc(-150 / 1206 * 100%); }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
    font-size: 24px; font-weight: 600; letter-spacing: 1px; color: rgba(219, 232, 255, .55);
  }
</style>
</head>
<body>
<div class="quilt"></div>
<div class="rays"></div>
<header>
  <div class="chip" id="chip"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</header>
<div class="device" id="device"><div class="screen"><img id="shot" alt=""></div></div>
<div class="foot" id="foot"></div>
<script>
  // One template, six slides. Captions stay short and honest: devnet build, SKR simulated.
  const SLIDES = {
    "1": { shot: "arena", chip: "Real-time PvE duels",
           title: "Every coin is<br>a <em>fighter</em>",
           sub: "Drag cards into a <b>3D arena</b>.<br>Take their towers in three minutes." },
    "2": { shot: "clockin", chip: "Daily streak",
           title: "<em>Clock in</em><br>every day",
           sub: "A 7-day reward track, each day<br><b>signed on Solana devnet</b>." },
    "3": { shot: "battle", chip: "Pick a rival",
           title: "Win a battle,<br>earn a <em>chest</em>",
           sub: "Four AI rival decks.<br><b>Standard 3:00</b> or <b>Rush 0:30</b>." },
    "4": { shot: "coach", chip: "On-device AI coach",
           title: "Scout every<br><em>rival</em> first",
           sub: "24 simulated matches on your phone.<br><b>Nothing leaves the device.</b>" },
    "5": { shot: "home-clocked", chip: "Seeker-ready",
           title: "Chests open<br>while you're <em>away</em>",
           sub: "A local notification when a chest<br>is ready or your streak needs you." },
    "6": { shot: "wallet", chip: "Devnet build",
           title: "No real funds.<br><em>Ever.</em>",
           sub: "Mobile Wallet Adapter on Android.<br>SKR is <b>simulated</b> in this build." },
  };
  const id = (location.hash || "#1").slice(1);
  const s = SLIDES[id];
  document.getElementById("chip").textContent = s.chip;
  document.getElementById("title").innerHTML = s.title;
  document.getElementById("sub").innerHTML = s.sub;
  document.getElementById("shot").src = "shots/" + s.shot + ".jpg";
  // Lay the device out under the header, whatever height the caption ended up.
  const head = document.querySelector("header").getBoundingClientRect();
  document.getElementById("device").style.top = Math.round(head.bottom + 64) + "px";
</script>
</body>
</html>
