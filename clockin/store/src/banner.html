<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mempire banner</title>
<style>
  /* #banner  : 1200x600, the Publisher Portal "Banner" (top of the detail page, behind the icon).
                The bottom-left corner stays quiet because the store draws the app icon over it.
     #feature : 1200x1200 feature graphic (only the legacy CLI asked for it; kept in case). */
  @font-face { font-family: "Lilita One"; src: url("../../../videos/gameplay-demo/brand/fonts/LilitaOne.ttf"); }
  @font-face { font-family: "Hanken Grotesk"; src: url("../../../videos/gameplay-demo/brand/fonts/HankenGrotesk.ttf"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #0d2a5c; color: #fff; }
  body { position: relative; font-family: "Hanken Grotesk", sans-serif; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 70% at 50% 40%, rgba(89, 166, 245, .55), transparent 75%),
      radial-gradient(55% 90% at 0% 20%, rgba(153, 69, 255, .6), transparent 70%),
      radial-gradient(55% 90% at 100% 30%, rgba(34, 211, 238, .45), transparent 70%),
      linear-gradient(180deg, #123a86, #0b2552 60%, #071634);
  }
  .quilt { position: absolute; inset: 0; background: url("art/quilt.jpg") center / 300px 300px repeat; opacity: .22; mix-blend-mode: overlay; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
           background: linear-gradient(180deg, transparent, rgba(4, 10, 32, .65)); }
  .wordmark { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 10px 18px rgba(4,10,32,.6)); }
  .f { position: absolute; bottom: 0; filter: drop-shadow(0 14px 16px rgba(4, 10, 32, .6)); }
  .tag { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lilita One", sans-serif;
         letter-spacing: 1px; text-shadow: 0 4px 0 rgba(6, 16, 38, .6); }
  .tag em { font-style: normal; color: #ffc422; }
  .chip { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
          font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #08131f;
          padding: 10px 22px; border-radius: 999px; background: linear-gradient(90deg, #9945ff, #14f195); }

  body.banner { width: 1200px; height: 600px; }
  body.banner .wordmark { top: 30px; width: 540px; }
  body.banner .tag { top: 290px; font-size: 44px; }
  body.banner .chip { display: none; }
  body.banner .f.sol  { right: 190px; height: 280px; bottom: -10px; }
  body.banner .f.btc  { right: 6px;   height: 310px; bottom: -14px; }
  body.banner .f.doge { left: 834px;  height: 250px; bottom: -6px; display: none; }
  body.banner .f.bonk { left: 40px;   height: 300px; bottom: -10px; transform: scaleX(-1); display: none; }
  body.banner .f.shib { right: 372px; height: 230px; bottom: -12px; }

  body.feature { width: 1200px; height: 1200px; }
  body.feature .wordmark { top: 70px; width: 820px; }
  body.feature .tag { top: 470px; font-size: 76px; }
  body.feature .chip { top: 580px; font-size: 26px; }
  body.feature .f.bonk { left: 10px;   height: 430px; bottom: 0; transform: scaleX(-1); }
  body.feature .f.shib { left: 225px;  height: 470px; bottom: 0; }
  body.feature .f.sol  { left: 470px;  height: 500px; bottom: 0; z-index: 2; }
  body.feature .f.btc  { left: 700px;  height: 470px; bottom: 0; }
  body.feature .f.doge { right: 0;     height: 440px; bottom: 0; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="quilt"></div>
<img class="f bonk" src="art/fighter_bonk.png" alt="">
<img class="f shib" src="art/fighter_shib.png" alt="">
<img class="f sol"  src="art/fighter_sol.png"  alt="">
<img class="f btc"  src="art/fighter_btc.png"  alt="">
<img class="f doge" src="art/fighter_doge.png" alt="">
<div class="floor"></div>
<img class="wordmark" src="art/wordmark.png" alt="Mempire">
<div class="tag">Every coin is a <em>fighter</em></div>
<div class="chip">Built for Solana Seeker · Devnet</div>
<script>document.body.className = (location.hash || "#banner").slice(1);</script>
</body>
</html>
