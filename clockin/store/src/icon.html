<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mempire icon</title>
<style>
  /* #store      : full-bleed 1024 square for the dApp Store (downscaled to 512) and mobile/assets/icon.png.
                   No baked-in rounded frame: the store and launchers apply their own mask.
     #background : the adaptive-icon background layer (quilt + glow, no crown). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #0d2a5c; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 520px at 50% 50%, rgba(89, 166, 245, .85), rgba(33, 96, 196, .35) 55%, transparent 80%),
      radial-gradient(700px 900px at -6% 40%, rgba(153, 69, 255, .55), transparent 60%),
      radial-gradient(700px 900px at 106% 60%, rgba(34, 211, 238, .45), transparent 60%),
      linear-gradient(180deg, #1a4fb0, #0f2f78 60%, #0a2156);
  }
  .quilt {
    position: absolute; inset: 0; background: url("art/quilt.jpg") center / 512px 512px repeat;
    opacity: .55; mix-blend-mode: overlay;
  }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(4, 10, 32, .75); }
  .crown {
    position: absolute; left: 50%; top: 52%; width: 76%; transform: translate(-50%, -50%);
    filter: drop-shadow(0 22px 18px rgba(4, 10, 32, .55)) drop-shadow(0 0 36px rgba(140, 220, 255, .55));
  }
  body.background .crown { display: none; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="quilt"></div>
<div class="vignette"></div>
<img class="crown" src="art/crown.png" alt="">
<script>
  document.body.className = (location.hash || "#store").slice(1);
</script>
</body>
</html>
