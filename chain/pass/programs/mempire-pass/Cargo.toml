[package]
name = "mempire-pass"
version = "0.1.0"
description = "Mempire Season Pass (soulbound Token-2022) and skins (Token-2022 with on-chain metadata), sold for SKR"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mempire_pass"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
